<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Buraq IT Services</title>
<meta name="description" content="Networking gear, cables, power backup and computer accessories from Buraq IT Services.">
<style>
  :root{ --header:#131a2b; --bg:#f3f4f6; --surface:#ffffff; --line:#e6e8eb; --text:#14181f; --muted:#6b7280; --accent:#f5820a; --accent-dark:#d96e00; --price:#c2410c; --badge:#0f7a52; --whatsapp:#22a559;}
  *{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.6;}
  h1{font-family:'Poppins',system-ui,sans-serif;margin:0;} a{color:inherit;} img{max-width:100%;display:block;}
  header.site{background:var(--header);position:sticky;top:0;z-index:50;}
 .header-inner{max-width:800px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
 .brand{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:600;color:#fff;}
 .brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:#141a1a;font-size:14px;}
 .back-link{font-size:13px;color:#d7dce8;text-decoration:none;border:1px solid #33405c;padding:7px 12px;border-radius:6px;}
  main{max-width:800px;margin:0 auto;padding:28px 20px 80px;}
 .product-media{aspect-ratio:4/3;background:#fafafa;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:zoom-in;}
 .product-media img{width:100%;height:100%;object-fit:contain;}
 .cat-label{font-size:11.5px;color:var(--badge);font-weight:600;text-transform:uppercase;margin-bottom:6px;}
  h1.product-title{font-size:clamp(20px,4vw,27px);font-weight:600;margin-bottom:8px;}
 .headline{font-size:14px;color:var(--accent-dark);font-weight:600;margin-bottom:14px;}
 .price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
 .price{font-size:26px;font-weight:700;color:var(--price);}.old-price{font-size:16px;color:var(--muted);text-decoration:line-through;}
 .discount-badge{background:#e11d1d;color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;}
 .gallery-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
 .gallery-thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;}
 .gallery-thumbs img.active{border-color:var(--accent);border-width:2px;}
 .highlights{list-style:none;padding:0;margin:0 0 26px;display:grid;gap:8px;}.highlights li{font-size:14px;display:flex;gap:8px;}.highlights li::before{content:"✓";color:var(--badge);font-weight:700;}
 .description{font-size:15px;color:var(--muted);line-height:1.7;margin-bottom:26px;}
 .actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;}
 .order-btn{background:var(--whatsapp);color:#fff;text-decoration:none;font-size:15px;font-weight:600;padding:13px 22px;border-radius:8px;display:flex;align-items:center;gap:8px;}
 .nav-btns{display:flex;justify-content:space-between;margin-top:12px}.nav-btns button{background:#111;color:#fff;border:none;padding:7px 14px;border-radius:6px;cursor:pointer}
  /* LIGHTBOX */
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:9999}
  #lightbox img{max-width:95vw;max-height:90vh;object-fit:contain}
  #lightbox.lb-close{position:absolute;top:15px;right:20px;color:#fff;font-size:30px;cursor:pointer}
  #lightbox.lb-arrow{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:42px;cursor:pointer;padding:10px;user-select:none}
  #lb-prev{left:10px} #lb-next{right:10px}
  footer{border-top:1px solid var(--line);padding:22px 20px;text-align:center;color:var(--muted);font-size:12.5px;background:var(--surface);}
 .loading{color:var(--muted);font-size:14px;}
</style>
</head>
<body>
<header class="site"><div class="header-inner"><div class="brand"><div class="brand-mark">B</div>Buraq IT Services</div><a class="back-link" href="../index.html">&#8592; All products</a></div></header>
<main id="productRoot"><p class="loading">Loading product...</p></main>
<div id="lightbox"><span class="lb-close" id="lb-close">✕</span><span class="lb-arrow" id="lb-prev">‹</span><img id="lb-img" src=""><span class="lb-arrow" id="lb-next">›</span></div>
<footer>Buraq IT Services · WhatsApp: +92 300 0118219</footer>
<script>
const WHATSAPP_NUMBER="923000118219";
function formatPrice(n){return n.toLocaleString('en-PK');}
function resolveImage(path){
  if(!path) return ""; if(/^https?:\/\//i.test(path)) return path;
  let p=path.replace(/^\/+/, ""); if(p.startsWith("images/")||!p.includes("/")) return "../"+p; return "../"+p;
}
let gallery=[], curIdx=0;
function openLB(i){curIdx=i; document.getElementById("lb-img").src=gallery[curIdx]; document.getElementById("lightbox").style.display="flex";}
function closeLB(){document.getElementById("lightbox").style.display="none";}
function lbNext(){curIdx=(curIdx+1)%gallery.length; document.getElementById("lb-img").src=gallery[curIdx]; updateMain();}
function lbPrev(){curIdx=(curIdx-1+gallery.length)%gallery.length; document.getElementById("lb-img").src=gallery[curIdx]; updateMain();}
function updateMain(){
  const main=document.getElementById("mainProductImg"); if(main) main.src=gallery[curIdx];
  document.querySelectorAll(".gallery-thumbs img").forEach((el,idx)=>el.classList.toggle("active", idx===curIdx));
}
const params=new URLSearchParams(window.location.search); const slug=params.get('slug'); const root=document.getElementById('productRoot');
if(!slug){root.innerHTML='<p class="loading">No product specified</p>';}else{
 fetch('../products.json?v='+Date.now()).then(r=>r.json()).then(products=>{
  const p=products.find(x=>x.slug===slug); if(!p){root.innerHTML='<p>Product not found</p>';return;}
  gallery=(p.images && p.images.length? p.images : (p.image?[p.image]:[])).map(resolveImage).filter((v,i,a)=>v&&a.indexOf(v)===i);
  const mainImg=gallery[0]||""; const mediaContent=mainImg?`<img id="mainProductImg" src="${mainImg}" onclick="openLB(curIdx)">`:`<span>No image</span>`;
  const thumbs=gallery.length>1?`<div class="gallery-thumbs">${gallery.map((src,i)=>`<img src="${src}" class="${i===0?'active':''}" onclick="curIdx=${i}; updateMain();">`).join('')}</div>`:'';
  const navBtns=gallery.length>1?`<div class="nav-btns"><button onclick="curIdx=(curIdx-1+gallery.length)%gallery.length; updateMain();">‹ پچھلی</button><button onclick="curIdx=(curIdx+1)%gallery.length; updateMain();">اگلی ›</button></div>`:'';
  const discount=p.oldPrice&&p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;
  const oldHtml=discount?`<span class="old-price">Rs ${formatPrice(p.oldPrice)}</span><span class="discount-badge">-${discount}%</span>`:'';
  const high=(p.highlights&&p.highlights.length)?`<ul class="highlights">${p.highlights.map(h=>`<li>${h}</li>`).join('')}</ul>`:'';
  const waText=encodeURIComponent(`Hi, I'm interested in: ${p.name}\nPrice: PKR ${formatPrice(p.price)}\nID: #${p.id}`);
  root.innerHTML=`<div class="product-media">${mediaContent}</div>${navBtns}${thumbs}<div class="cat-label" style="margin-top:16px;">${p.category}</div><h1 class="product-title">${p.name}</h1><div class="price-row"><div class="price">Rs ${formatPrice(p.price)}</div>${oldHtml}</div>${high}<p class="description">${p.description||''}</p><div class="actions"><a class="order-btn" href="https://wa.me/${WHATSAPP_NUMBER}?text=${waText}" target="_blank">Order on WhatsApp</a></div><a href="../index.html">&#8592; Back to catalog</a>`;
  document.title=p.name+" — Buraq IT Services";
 }).catch(()=>{root.innerHTML='<p>Could not load</p>';});
}
document.getElementById("lb-close").onclick=closeLB;
document.getElementById("lb-next").onclick=lbNext;
document.getElementById("lb-prev").onclick=lbPrev;
document.getElementById("lightbox").onclick=(e)=>{if(e.target.id==="lightbox") closeLB();}
// swipe support
let sx=0; const lb=document.getElementById("lightbox");
lb.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
lb.addEventListener("touchend",e=>{let ex=e.changedTouches[0].clientX; if(sx-ex>60) lbNext(); if(ex-sx>60) lbPrev();},{passive:true});
</script>
</body>
</html>
