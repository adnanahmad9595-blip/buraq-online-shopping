<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Buraq IT</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Inter,sans-serif;background:#f1f5f9}header{background:#0f172a;padding:14px 20px;display:flex;justify-content:space-between}.h{color:#fff;font-weight:600}header a{color:#cbd5e1;border:1px solid #334155;padding:6px 12px;border-radius:8px;text-decoration:none}main{max-width:1100px;margin:20px auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:800px){main{grid-template-columns:1fr}}.box{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px}.main-img{width:100%;aspect-ratio:4/3;object-fit:contain}.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.thumbs img{border:1px solid #e2e8f0;border-radius:8px;cursor:pointer;padding:3px;aspect-ratio:1/1;object-fit:cover}.thumbs img.active{border:2px solid #f97316}.price{font-size:26px;font-weight:800;color:#dc2626}.btn{background:#25d366;color:#fff;padding:14px;border-radius:12px;text-decoration:none;display:inline-flex;font-weight:700;margin-top:12px}</style>
</head><body><header><div class="h">Buraq IT Services</div><a href="../index.html">← All</a></header><main id="root">Loading product... If stuck, check products.json path</main>
<script>
const slug = new URLSearchParams(location.search).get('slug');
console.log('SLUG:', slug);
fetch('../products.json')
  .then(r => { if(!r.ok) throw new Error('products.json not found at ../products.json - Status '+r.status); return r.json(); })
  .then(data => {
    const p = data.find(x => x.slug === slug);
    if(!p){ document.getElementById('root').innerHTML = `<div class="box"><h2>Product not found: ${slug}</h2><p>Check products.json has slug "${slug}"</p><p>Available: ${data.map(d=>d.slug).join(', ')}</p></div>`; return; }
    const imgs = p.images && p.images.length ? p.images : (p.image ? [p.image] : []);
    document.getElementById('root').innerHTML = `<div class="box"><img id="m" class="main-img" src="${imgs[0]||''}"><div class="thumbs">${imgs.map((im,i)=>`<img src="../${im.replace('../','').replace('images/','../images/')}" class="${i==0?'active':''}" onclick="document.getElementById('m').src=this.src;this.parentNode.querySelectorAll('img').forEach(e=>e.classList.remove('active'));this.classList.add('active')">`).join('')}</div></div><div class="box"><div style="color:#059669;font-size:11px;font-weight:700;text-transform:uppercase">${p.category}</div><h1 style="font-family:Poppins">${p.name}</h1><div class="price">Rs ${p.price.toLocaleString('en-PK')}</div><p>${p.description}</p><a class="btn" href="https://wa.me/923000118219?text=${encodeURIComponent('I want '+p.name)}" target="_blank">Order on WhatsApp</a></div>`;
  })
  .catch(err => {
    document.getElementById('root').innerHTML = `<div class="box" style="grid-column:1/-1;color:red"><h3>Error Loading: ${err.message}</h3><p>1. Check products.json is in root folder (same as index.html)<br>2. Check products.json has valid JSON - no extra comma<br>3. Check images folder exists<br>Open Console (F12) to see details</p></div>`;
    console.error(err);
  });
</script></body></html>
