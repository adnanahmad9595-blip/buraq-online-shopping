<title>Buraq IT Services — Professional IT Store</title>

<style>
:root{ --header:#0f172a; --header2:#1e293b; --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0; --text:#0f172a; --muted:#64748b; --accent:#f97316; --price:#dc2626; --badge:#059669; --whatsapp:#25d366; }
*{box-sizing:border-box}html,body{margin:0;padding:0;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
/* HEADER */
header{ background:linear-gradient(135deg,var(--header) 0%, var(--header2) 100%); position:sticky; top:0; z-index:100; backdrop-filter:blur(10px); box-shadow:0 4px 20px rgba(0,0,0,.15);}
.h-inner{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#f97316,#fb923c);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:20px;box-shadow:0 4px 12px rgba(249,115,22,.4)}
.brand-name{color:#fff;font-family:Poppins;font-weight:600;font-size:17px}.brand-sub{color:#94a3b8;font-size:11px;letter-spacing:.5px}
.search-wrap{flex:1;max-width:600px;position:relative}
.search-wrap input{width:100%;border:none;background:#fff;padding:12px 16px 12px 44px;border-radius:12px;font-size:14.5px;box-shadow:0 2px 10px rgba(0,0,0,.08);transition:.2s}
.search-wrap input:focus{outline:none;box-shadow:0 4px 20px rgba(249,115,22,.25);transform:translateY(-1px)}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#94a3b8}
.contact{background:var(--accent);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;font-size:13px;text-decoration:none;box-shadow:0 4px 12px rgba(249,115,22,.3);transition:.2s}
.contact:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(249,115,22,.4)}
/* HERO with gradient bg */
.hero{max-width:1240px;margin:0 auto;padding:50px 20px 30px;position:relative;overflow:hidden}
.hero-bg{position:absolute;top:-80px;right:-80px;width:400px;height:400px;background:radial-gradient(circle, rgba(249,115,22,.15) 0%, transparent 70%);border-radius:50%;pointer-events:none}
.hero h1{font-size:clamp(26px,4vw,36px);font-weight:700;max-width:650px;line-height:1.2;position:relative}
.hero h1 span{background:linear-gradient(135deg,#f97316,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);max-width:580px;margin-top:12px;font-size:15px;line-height:1.6}
