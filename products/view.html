<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buraq IT - Product</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--price:#dc2626;--wa:#25d366}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,sans-serif;color:var(--text)}
header{background:#0f172a;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
header .logo{color:#fff;font-family:Poppins;font-weight:600}
header a{color:#cbd5e1;border:1px solid #334155;padding:7px 14px;border-radius:8px;text-decoration:none;font-size:13px}
main{max-width:1100px;margin:20px auto;padding:0 20px 100px;display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
@media(max-width:850px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.main-img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:12px}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.thumbs img{width:100%;aspect-ratio:1/1;object-fit:contain;border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;background:#fff}
.thumbs img.active{border:2px solid #f97316}
h1{font-family:Poppins;font-size:24px;margin:8px 0}
.price{font-size:28px;font-weight:800;color:var(--price)}
.btn{display:flex;gap:10px;margin-top:18px}
.btn a{flex:1;text-align:center;padding:14px;border-radius:12px;text-decoration:none;font-weight:700}
.btn-wa{background:var(--wa);color:#fff}
.btn-back{border:1px solid var(--line);color:var(--text);background:#fff}
</style>
</head>
<body>
